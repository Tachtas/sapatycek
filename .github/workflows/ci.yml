# Gerbang sebelum deploy: pastikan bundel tidak berisi nama tak dikenal
# (penyebab layar putih / ReferenceError di HP operator) dan tetap bisa dibangun.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
